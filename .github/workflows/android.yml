name: android

# 在 GitHub 的服务器上把 www/ 打包成安卓安装包（.apk），本机不需要装任何安卓开发工具。
# 手动运行：Actions → android → Run workflow；打 v 开头的标签（如 v0.1.0）时会自动发布到 Releases。
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3
      - name: Create Android project
        run: npx cap add android
      - name: App icon
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0e1110" --iconBackgroundColorDark "#0e1110" --splashBackgroundColor "#0e1110" --splashBackgroundColorDark "#0e1110"
        continue-on-error: true
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: |
          VER=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="dev-$(date -u +%Y%m%d)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "medreg-radar-$VER.apk"
          echo "APK=medreg-radar-$VER.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          body: "安卓安装包。下载后打开即可安装（需允许“安装未知来源应用”）。使用方法见 App 内“指南”。"
